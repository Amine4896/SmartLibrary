name: Build, Publish and Deploy to Azure

on:
  push:
    branches: [ "feature/devops-docker", "main" ]

env:
  AZURE_RESOURCE_GROUP: 'SmartLibrary-RG'
  AZURE_APP_NAME: 'smartlibrary-ehtp-demo' // Remplacez par un nom unique si nécessaire
  AZURE_LOCATION: 'westeurope'
  DOCKER_IMAGE_NAME: '${{ secrets.DOCKER_USERNAME }}/smartlibrary'

jobs:
  # 1. Compilation et Tests Unitaires
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration de .NET 10
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restauration des packages NuGet
        run: dotnet restore

      - name: Compilation de l'application
        run: dotnet build --configuration Release --no-restore

      - name: Exécution des tests unitaires (xUnit)
        run: dotnet test --no-build --verbosity normal

  # 2. Construction et Publication de l'image Docker
  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build et Push de l'image sur Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  # 3. Déploiement sur Azure Web App via Profil de Publication (Sans Service Principal)
  azure-deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement du conteneur sur Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'docker.io/${{ env.DOCKER_IMAGE_NAME }}:latest'
